# Listing 4-9. Continuous integration for the agents (GitHub Actions).
# To use it, place this file in .github/workflows/ in your repository.
name: agents
on:
  push:                       # every change: the fast, exact tests
  schedule:
    - cron: "0 2 * * *"       # every night: the evaluation set too
  workflow_dispatch:          # and whenever someone asks
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest
      - run: pytest -m "not llm" -q
  evaluation:
    if: github.event_name != 'push'
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest
      - run: curl -fsSL https://ollama.com/install.sh | sh
      - run: ollama pull llama3.1:8b
      - run: pytest -m llm -q -s
